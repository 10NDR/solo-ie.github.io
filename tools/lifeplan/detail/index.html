    <script>
      // React の起動前に data-theme を確定させ、選択がライトのときの一瞬のダーク表示を防ぐ。
      // キーと値の形式は src/utils/theme.ts と揃えている（生の文字列で保存している）。
      // 2ページ構成なので、片方に入れ忘れるとそのページだけちらつく。必ず両方に置くこと。
      (function () {
        try {
          var saved = localStorage.getItem('lifeplan-theme');
          var resolved =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
