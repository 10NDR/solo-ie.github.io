    <!-- 公開先は solo-ie.com の1箇所に固定されているため絶対URLで直接書く。
         ローカルで開いても本番URLのまま表示されるのが正しい（Hugo の static/ は
         baseURL の書き換えを受けないため、ここが唯一の正本になる）。 -->
    <link rel="canonical" href="https://solo-ie.com/tools/lifeplan/" />
    <script>
      // React の起動前に data-theme を確定させ、選択がライトのときの一瞬のダーク表示を防ぐ。
      // キーと値の形式は src/utils/theme.ts と揃えている（生の文字列で保存している）。
      // 2ページ構成なので、片方に入れ忘れるとそのページだけちらつく。必ず両方に置くこと。
      (function () {
        try {
          var saved = localStorage.getItem('lifeplan-theme');
          var resolved =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
